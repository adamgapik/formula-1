<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes, minimal-ui">
  <title>Видео при загрузке</title>
  <style>
    /* Базовые сбросы и мобильная оптимизация */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Полностью убираем скролл */
      background: #000; /* Черный фон под видео */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: pan-x pan-y; /* Позволяет жесты, но не мешает видео */
    }

    /* Контейнер видео занимает весь экран */
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Для очень маленьких экранов можно добавить высоту с учетом вырезов, но обычно 100% достаточно */
      height: 100dvh; /* динамическая высота для мобильных */
      z-index: 1;
      overflow: hidden;
      background: #000;
    }

    /* Само видео растягивается на весь экран с сохранением пропорций (покрытие) */
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Видео заполняет экран, обрезая лишнее */
      display: block;
      background: #000;
      /* Убираем стандартные контролы на мобильных */
      pointer-events: none; /* Чтобы случайные нажатия не ставили на паузу, если контролы скрыты */
    }

    /* Небольшой слой для контента поверх видео, если понадобится что-то добавить */
    .overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 2;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none; /* Чтобы клики проходили сквозь к видео, если нужно */
    }

    /* Текстовая подсказка (опционально) - стильная, полупрозрачная */
    .hint {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: white;
      font-size: 14px;
      padding: 8px 18px;
      border-radius: 30px;
      letter-spacing: 0.5px;
      text-align: center;
      pointer-events: auto; /* Чтобы можно было нажать, если добавить действия */
      transition: opacity 0.5s ease;
      opacity: 0.8;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Для очень маленьких экранов уменьшаем отступы */
    @media (max-width: 380px) {
      .hint {
        font-size: 12px;
        padding: 6px 16px;
        margin-bottom: 12px;
      }
    }

    /* Индикатор загрузки, показывается если видео еще не началось */
    .loading-spinner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none; /* скрыт по умолчанию, показывается через JS при необходимости */
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Убираем стандартные элементы управления видео (на всякий случай) */
    video::-webkit-media-controls {
      display: none !important;
    }
    video::-webkit-media-controls-enclosure {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Видео контейнер -->
  <div class="video-container">
    <!-- 
      ВАЖНО: Замените src на ссылку вашего видео.
      Сейчас установлено демо-видео (публичное, бесплатное, природа).
      Рекомендуется использовать прямую ссылку на mp4 файл.
      Для мобильной версии видео должно быть оптимизировано (не слишком тяжелое).
      Добавлены атрибуты для автовоспроизведения без звука, зацикливания и без контролов.
    -->
    <video 
      id="mainVideo"
      autoplay 
      muted 
      loop 
      playsinline 
      preload="auto"
      poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
    >
      <!-- ЗАМЕНИТЕ src НА ВАШЕ ВИДЕО -->
      <source src="https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4" type="video/mp4">
      
      <!-- Резервный текст, если видео не загрузится -->
      Ваш браузер не поддерживает видео.
    </video>
  </div>

  <!-- Крутящийся индикатор загрузки (показывается, пока видео буферизуется) -->
  <div id="loadingSpinner" class="loading-spinner"></div>

  <!-- Небольшая надпись внизу, можно убрать или изменить -->
  <div class="overlay">
    <div class="hint" id="statusHint">
      📱 Загрузка видео...
    </div>
  </div>

  <script>
    (function() {
      // Строгий режим для мобильной оптимизации
      'use strict';

      const video = document.getElementById('mainVideo');
      const spinner = document.getElementById('loadingSpinner');
      const hint = document.getElementById('statusHint');

      // Функция для обновления состояния подсказки
      function updateHint(text, showSpinner = false) {
        if (hint) {
          hint.textContent = text;
        }
        if (spinner) {
          spinner.style.display = showSpinner ? 'block' : 'none';
        }
      }

      // Проверка, что видео элемент существует
      if (!video) {
        updateHint('⚠️ Ошибка: видео не найдено', false);
        return;
      }

      // Показываем спиннер сразу при загрузке
      updateHint('🎬 Загружаем видео...', true);

      // Обработчик, когда видео достаточно загружено для воспроизведения
      video.addEventListener('canplay', function() {
        updateHint('▶️ Видео готово', false);
        // Пытаемся запустить воспроизведение (на мобильных требуется взаимодействие, но autoplay muted обычно работает)
        attemptPlay();
      });

      // Обработчик начала воспроизведения
      video.addEventListener('play', function() {
        updateHint('📱 Видео запущено', false);
        // Скрываем спиннер после начала воспроизведения
        if (spinner) spinner.style.display = 'none';
      });

      // Обработчик паузы (если пользователь как-то поставил на паузу, но контролов нет, маловероятно)
      video.addEventListener('pause', function() {
        // Если видео не закончилось и не в буфере, пробуем перезапустить
        if (video.readyState >= 2 && !video.ended) {
          // Возможно, была случайная пауза, пробуем воспроизвести снова
          attemptPlay();
        }
      });

      // Обработка ошибок загрузки видео
      video.addEventListener('error', function(e) {
        console.error('Ошибка загрузки видео:', e);
        updateHint('⚠️ Не удалось загрузить видео', false);
        // Показываем черный экран, но hint остается
      }, true);

      // Обработка, если видео забуферилось и ждет
      video.addEventListener('waiting', function() {
        updateHint('⏳ Буферизация...', true);
      });

      video.addEventListener('playing', function() {
        updateHint('📱 Видео', false);
        if (spinner) spinner.style.display = 'none';
      });

      // Функция для безопасной попытки воспроизведения
      function attemptPlay() {
        if (video.paused) {
          var playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.then(function() {
              // Воспроизведение началось успешно
              if (spinner) spinner.style.display = 'none';
            }).catch(function(error) {
              // Автовоспроизведение было заблокировано (редко на современных мобильных с muted)
              console.warn('Автовоспроизведение заблокировано:', error);
              updateHint('👆 Нажмите для запуска', false);
              
              // Добавляем обработчик клика по всему экрану для запуска видео
              const resumeOnTouch = function() {
                video.play().then(function() {
                  updateHint('📱 Видео', false);
                }).catch(function(e) {
                  console.error('Не удалось запустить видео после касания:', e);
                });
                // Удаляем обработчик после первого касания
                document.body.removeEventListener('click', resumeOnTouch);
                document.body.removeEventListener('touchstart', resumeOnTouch);
              };
              
              document.body.addEventListener('click', resumeOnTouch);
              document.body.addEventListener('touchstart', resumeOnTouch);
            });
          }
        }
      }

      // Дополнительно: при загрузке страницы пробуем воспроизвести, если видео уже готово
      if (video.readyState >= 2) {
        attemptPlay();
      }

      // На случай, если видео уже в процессе загрузки, но canplay еще не сработал
      video.load();

      // Для мобильных Safari иногда нужно явно вызвать play после загрузки
      window.addEventListener('load', function() {
        setTimeout(function() {
          attemptPlay();
        }, 100);
      });

      // Обработка видимости страницы (если пользователь свернул браузер и вернулся)
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden && video.paused && video.readyState >= 2) {
          attemptPlay();
        }
      });

      // Убираем стандартный вызов контекстного меню на долгом нажатии (чтобы не мешало)
      video.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Инициализация: сразу показываем спиннер
      updateHint('🎬 Загрузка...', true);

    })();
  </script>
</body>
</html>
